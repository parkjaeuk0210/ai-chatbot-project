name: Finalize PERA dependency cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/pera-enterprise-ui

      - name: Determine whether cleanup is needed
        id: gate
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[dependency-cleanup\]'; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove unused dependencies and legacy build files
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'package.json';
          const packageJson = JSON.parse(readFileSync(path, 'utf8'));
          packageJson.dependencies = { express: '^4.17.1' };
          delete packageJson.devDependencies;
          writeFileSync(path, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          rm -f README-DEBUG.md postcss.config.cjs tailwind.config.cjs
          npm install --package-lock-only --ignore-scripts

      - name: Verify clean dependency graph and application contracts
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run build
          rm -rf public

      - name: Commit dependency cleanup
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove unused build and service dependencies [dependency-cleanup]"
          git push origin HEAD:agent/pera-enterprise-ui
