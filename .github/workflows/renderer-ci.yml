name: Renderer CI

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/pera-renderer/**'
      - 'js/renderer/**'
      - 'renderer-demo.html'
      - 'package.json'
      - '.github/workflows/renderer-ci.yml'
  push:
    branches:
      - 'feat/phase3-wgpu-renderer-slice1'
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/pera-renderer/**'
      - 'js/renderer/**'
      - 'renderer-demo.html'
      - 'package.json'
      - '.github/workflows/renderer-ci.yml'

permissions:
  contents: read

jobs:
  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript and tests
        run: npm run check

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-1.87-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.87-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check renderer for wasm32
        run: cargo check --locked --package pera-renderer --target wasm32-unknown-unknown

      - name: Run Clippy for wasm32
        run: cargo clippy --locked --package pera-renderer --target wasm32-unknown-unknown -- -D warnings

      - name: Build release Wasm
        run: cargo build --locked --package pera-renderer --target wasm32-unknown-unknown --release

      - name: Verify Wasm artifact
        run: test -s target/wasm32-unknown-unknown/release/pera_renderer.wasm
