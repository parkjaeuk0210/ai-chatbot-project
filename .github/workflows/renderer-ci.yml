name: Renderer CI

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'Cargo.lock'
      - 'crates/pera-renderer/**'
      - 'js/renderer/**'
      - 'renderer-demo.html'
      - 'package.json'
      - '.github/workflows/renderer-ci.yml'
  push:
    branches:
      - 'feat/phase3-wgpu-renderer-slice1'
    paths:
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'Cargo.lock'
      - 'crates/pera-renderer/**'
      - 'js/renderer/**'
      - 'renderer-demo.html'
      - 'package.json'
      - '.github/workflows/renderer-ci.yml'

permissions:
  contents: write

jobs:
  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript and tests
        run: npm run check

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Commit lockfile on branch push
        if: github.event_name == 'push'
        run: |
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1 && git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(renderer): lock Rust dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check renderer for wasm32
        run: cargo check --locked --package pera-renderer --target wasm32-unknown-unknown

      - name: Run Clippy for wasm32
        run: cargo clippy --locked --package pera-renderer --target wasm32-unknown-unknown -- -D warnings

      - name: Build release Wasm
        run: cargo build --locked --package pera-renderer --target wasm32-unknown-unknown --release
