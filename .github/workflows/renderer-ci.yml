name: Renderer CI

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'crates/pera-renderer/**'
      - 'js/renderer/**'
      - 'renderer-demo.html'
      - 'package.json'
      - '.github/workflows/renderer-ci.yml'
  push:
    branches:
      - 'feat/phase3-wgpu-renderer-slice1'
    paths:
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'crates/pera-renderer/**'
      - 'js/renderer/**'
      - 'renderer-demo.html'
      - 'package.json'
      - '.github/workflows/renderer-ci.yml'

permissions:
  contents: read

jobs:
  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript and tests
        run: npm run check

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Apply Rust formatting
        run: cargo fmt --all

      - name: Upload formatted Rust sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-rust
          path: crates/pera-renderer/src
          if-no-files-found: error

      - name: Verify formatting is committed
        run: git diff --exit-code
