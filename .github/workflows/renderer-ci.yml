name: Renderer CI

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/pera-renderer/**'
      - 'js/renderer/**'
      - 'renderer-demo.html'
      - 'package.json'
      - '.github/workflows/renderer-ci.yml'
  push:
    branches:
      - 'feat/phase3-wgpu-renderer-slice1'
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/pera-renderer/**'
      - 'js/renderer/**'
      - 'renderer-demo.html'
      - 'package.json'
      - '.github/workflows/renderer-ci.yml'

permissions:
  contents: read

jobs:
  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript and tests
        run: npm run check

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-1.87-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.87-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check renderer for wasm32
        id: cargo-check
        continue-on-error: true
        run: cargo check --locked --package pera-renderer --target wasm32-unknown-unknown 2>&1 | tee cargo-check.log

      - name: Upload cargo check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-log
          path: cargo-check.log
          if-no-files-found: error

      - name: Run Clippy for wasm32
        if: steps.cargo-check.outcome == 'success'
        id: clippy
        continue-on-error: true
        run: cargo clippy --locked --package pera-renderer --target wasm32-unknown-unknown -- -D warnings 2>&1 | tee clippy.log

      - name: Upload Clippy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: clippy.log
          if-no-files-found: ignore

      - name: Build release Wasm
        if: steps.cargo-check.outcome == 'success' && steps.clippy.outcome == 'success'
        id: release-build
        continue-on-error: true
        run: cargo build --locked --package pera-renderer --target wasm32-unknown-unknown --release 2>&1 | tee release-build.log

      - name: Upload release build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: release-build.log
          if-no-files-found: ignore

      - name: Verify Wasm artifact
        if: steps.release-build.outcome == 'success'
        run: test -s target/wasm32-unknown-unknown/release/pera_renderer.wasm

      - name: Fail on Rust validation errors
        if: steps.cargo-check.outcome == 'failure' || steps.clippy.outcome == 'failure' || steps.release-build.outcome == 'failure'
        run: exit 1
